<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Legion · Tracked Systems</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23162646'/%3E%3Cellipse cx='16' cy='16' rx='12' ry='5.5' fill='none' stroke='%23739BCF' stroke-width='2.4' transform='rotate(-28 16 16)'/%3E%3Ccircle cx='16' cy='16' r='4.6' fill='%23385FAF'/%3E%3Ccircle cx='26.3' cy='11.1' r='2.5' fill='%23E8A33D'/%3E%3C/svg%3E">
<style>
:root{
  --navy:#162646; --blue-1:#385FAF; --blue-2:#739BCF;
  --green:#27AE60; --green-bright:#3FCB7C;
  --amber:#E8A33D; --amber-bright:#F5B95A;
  --china:#C0574A; --china-bright:#DD7264;
  --surface:#0f1a30; --surface-2:#152238; --surface-3:#1c2c48;
  --line:#27406e; --line-soft:#1f3358;
  --text:#e6ecf6; --text-dim:#9fb2cf; --text-faint:#7d8fb3;
  --radius:3px; --motion:150ms;
  /* Categorical series slots, in fixed order, for the family charts. These
     are the dark steps of the validated reference palette, checked against
     this panel surface (#152238): lightness band, chroma floor, adjacent
     colour-vision-deficiency separation, normal-vision separation and
     contrast all pass. The order is the colour-blind-safety mechanism, so
     do not reorder them, and never add a ninth: a family past eight members
     lists the remainder instead of reusing a colour. */
  --series-1:#3987e5; --series-2:#d95926; --series-3:#199e70; --series-4:#c98500;
  --series-5:#d55181; --series-6:#008300; --series-7:#9085e9; --series-8:#e66767;
}
@media (prefers-reduced-motion: reduce){ *{ transition-duration:.001ms !important; } }
*{ box-sizing:border-box; }

.skip-link{ position:absolute; left:-9999px; top:0; background:var(--blue-1); color:#fff;
  padding:10px 16px; z-index:100; border-radius:0 0 var(--radius) 0; }
.skip-link:focus{ left:0; }
.visually-hidden{ position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
html,body{ margin:0; background:var(--navy); color:var(--text); font-family:"Segoe UI",-apple-system,Arial,sans-serif; }
.wrap{ max-width:1180px; margin:0 auto; padding:24px 20px 70px; }
header{ display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;
  border-bottom:1px solid var(--line); padding-bottom:16px; margin-bottom:18px; }
.eyebrow{ font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--blue-2); font-weight:600; }
h1{ font-size:24px; margin:4px 0 0; letter-spacing:.01em; }
.subtitle{ font-size:12.5px; color:var(--text-dim); margin-top:2px; }
.layout{ display:grid; grid-template-columns:1fr 380px; gap:20px; align-items:start; }
@media (max-width:900px){ .layout{ grid-template-columns:1fr; } }

.panel{ background:var(--surface-2); border:1px solid var(--line); border-radius:var(--radius); padding:16px; }
.panel h2{ display:flex; align-items:center; gap:7px; font-size:12px; text-transform:uppercase;
  letter-spacing:.08em; color:var(--text-dim); margin:0 0 12px; }

.filters{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
.filters input, .filters select{ background:var(--surface-3); border:1px solid var(--line); color:var(--text);
  padding:7px 9px; border-radius:var(--radius); font-family:inherit; font-size:12.5px; }
.filters input[type=text]{ flex:1; min-width:160px; }
.filters label{ display:flex; align-items:center; gap:5px; font-size:12px; color:var(--text-dim); }

table{ width:100%; border-collapse:collapse; font-size:12.5px; }
th{ text-align:left; font-size:10px; text-transform:uppercase; color:var(--text-faint); padding:6px 8px;
  border-bottom:1px solid var(--line-soft); }
td{ padding:8px; border-bottom:1px solid var(--line-soft); color:var(--text-dim); vertical-align:top; }
tr.row{ cursor:pointer; }
tr.row:hover td{ background:var(--surface-3); }
tr.selected td{ background:rgba(56,95,175,.18); }
.badge{ font-size:10px; padding:2px 7px; border-radius:10px; border:1px solid; }
.badge.rus{ color:var(--blue-2); border-color:var(--blue-2); }
.badge.chn{ color:var(--china-bright); border-color:var(--china); }
.badge.other{ color:var(--text-dim); border-color:var(--line); }
.pill{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; padding:2px 8px;
  border-radius:10px; border:1px solid; white-space:nowrap; }
.pill.onorbit{ color:var(--amber-bright); border-color:var(--amber); }
.pill.decayed{ color:var(--green-bright); border-color:var(--green); }
.pill.decaying{ color:var(--amber-bright); border-color:var(--amber); opacity:.75; }
.pill.unknown{ color:var(--text-faint); border-color:var(--line); }
.count{ display:block; font-size:11.5px; color:var(--text-faint); margin-bottom:8px; }

/* Sortable column headers. The whole header is a button so the control is
   reachable by keyboard and announced as one; aria-sort on the th is what a
   screen reader uses to say which column the order follows. */
th.sortable{ padding:0; }
th.sortable button{ display:flex; align-items:center; gap:5px; width:100%; background:none; border:0;
  color:inherit; font:inherit; text-transform:inherit; letter-spacing:inherit; cursor:pointer;
  padding:6px 8px; text-align:left; }
th.sortable button:hover{ color:var(--blue-2); }
th.sortable button:focus-visible{ outline:2px solid var(--blue-2); outline-offset:-2px; }
th[aria-sort="ascending"] button, th[aria-sort="descending"] button{ color:var(--text); }
.sort-mark{ font-size:9px; color:var(--text-faint); }
th[aria-sort="ascending"] .sort-mark, th[aria-sort="descending"] .sort-mark{ color:var(--blue-2); }

form .field{ margin-bottom:10px; }
form label{ display:block; font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--text-faint);
  margin-bottom:4px; }
form input, form select, form textarea{ width:100%; background:var(--surface-3); border:1px solid var(--line);
  color:var(--text); padding:7px 9px; border-radius:var(--radius); font-family:inherit; font-size:12.5px; }
form textarea{ min-height:56px; resize:vertical; }
.field-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.form-actions{ display:flex; gap:8px; margin-top:14px; }
.btn{ display:inline-flex; align-items:center; gap:6px; font-family:inherit; font-size:12.5px;
  padding:8px 14px; border-radius:var(--radius); cursor:pointer; border:1px solid; }
/* The `hidden` attribute is only a user-agent `display:none`, so any author
   rule that sets `display` beats it. `.btn` does exactly that, which left a
   hidden button on screen until a browser test caught it. */
[hidden]{ display:none !important; }
.btn-primary{ background:var(--blue-1); border-color:var(--blue-1); color:#fff; }
.btn-primary:hover{ background:#4571c7; }
.btn-ghost{ background:none; border-color:var(--line); color:var(--text-dim); }
.btn-ghost:hover{ color:var(--text); border-color:var(--blue-2); }
.btn-danger{ background:none; border-color:var(--china); color:var(--china-bright); }
.btn-danger:hover{ background:rgba(192,87,74,.12); }
.msg{ display:block; font-size:12px; margin-top:8px; min-height:16px; }
.msg.error{ color:var(--china-bright); }
.msg.ok{ color:var(--green-bright); }
.empty{ text-align:center; padding:30px; color:var(--text-faint); font-size:13px; }

/* Rows per page is a view setting, not a filter, so it sits apart from them
   at the right of the row. */
.filters label[for="fRows"]{ margin-left:auto; }
.pager{ display:flex; align-items:center; gap:10px; margin-top:12px; }
.pager .btn{ padding:5px 10px; font-size:12px; }
.pager .btn[disabled]{ opacity:.4; cursor:default; }
.page-of{ font-size:11.5px; color:var(--text-faint); font-variant-numeric:tabular-nums; }

/* Icons. One inline sprite, referenced by <use>, so there is no network
   request and nothing to go missing offline. Every icon is decorative: it sits
   beside a label that already says the same thing, so each is aria-hidden and
   inherits the text colour rather than carrying meaning in colour. */
.icon{ width:1em; height:1em; flex:none; fill:none; stroke:currentColor;
  stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.mark{ width:34px; height:34px; flex:none; }
.brand{ display:flex; align-items:center; gap:12px; }
.panel h2 .icon{ width:13px; height:13px; stroke-width:2; color:var(--blue-2); }
.btn .icon{ width:13px; height:13px; }
/* A status shows its state as shape as well as colour: filled for on-orbit,
   open for decayed, dashed for anything unconfirmed. */
.pill .icon{ width:9px; height:9px; stroke-width:2.4; }
.pill.onorbit .icon{ fill:currentColor; }
.pill.decaying .icon{ fill:currentColor; opacity:.55; }
.pill.decayed .icon{ fill:none; }
.pill.unknown .icon{ fill:none; stroke-dasharray:2 2; }

/* Family movement charts */
.chart-panel{ grid-column:1 / -1; }
.chart-controls{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:6px; }
.chart-controls select{ background:var(--surface-3); border:1px solid var(--line); color:var(--text);
  padding:7px 9px; border-radius:var(--radius); font-family:inherit; font-size:12.5px; }
.chart-block{ margin-top:22px; }
.chart-block h3{ font-size:13px; margin:0; color:var(--text); font-weight:600; }
.chart-unit{ font-size:11px; color:var(--text-faint); font-weight:400; }
.chart-note{ font-size:11.5px; color:var(--text-faint); margin:4px 0 10px; max-width:80ch; line-height:1.5; }
.chart-figure{ position:relative; }
svg.chart{ width:100%; height:auto; display:block; overflow:visible; }
.legend{ display:flex; flex-wrap:wrap; gap:6px 20px; margin-top:12px; }
.legend-item{ display:flex; align-items:center; gap:7px; font-size:11.5px; color:var(--text-dim); }
.legend-key{ width:16px; height:3px; border-radius:2px; flex:none; }
.legend-value{ color:var(--text); font-variant-numeric:tabular-nums; }
.legend-note{ color:var(--text-faint); font-style:italic; }
.legend-rank{ font-size:10px; color:var(--text-faint); border:1px solid var(--line);
  border-radius:10px; padding:1px 6px; }
.tip{ position:absolute; pointer-events:none; z-index:5; background:var(--surface); border:1px solid var(--line);
  border-radius:var(--radius); padding:6px 9px; font-size:11.5px; color:var(--text); white-space:nowrap;
  opacity:0; transition:opacity var(--motion); }
.tip.on{ opacity:1; }
.tip-name{ font-weight:600; }
.tip-value{ font-variant-numeric:tabular-nums; }
.table-view{ margin-top:12px; }
.table-view summary{ cursor:pointer; font-size:11.5px; color:var(--text-dim); }
.table-view summary:hover{ color:var(--text); }
.chart-table{ max-height:320px; overflow:auto; margin-top:8px; }
.chart-table td{ font-variant-numeric:tabular-nums; }
.skipped{ font-size:11.5px; color:var(--text-faint); margin-top:12px; }
/* Refetching holds the previous render rather than flashing a skeleton. */
.stale{ opacity:.45; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-mark" viewBox="0 0 32 32">
      <rect x="0.9" y="0.9" width="30.2" height="30.2" rx="6" fill="var(--surface-2)" stroke="var(--line)"/>
      <ellipse cx="16" cy="16" rx="12" ry="5.5" fill="none" stroke="var(--blue-2)" stroke-width="2.2" transform="rotate(-28 16 16)"/>
      <circle cx="16" cy="16" r="4.6" fill="var(--blue-1)" stroke="none"/>
      <circle cx="26.3" cy="11.1" r="2.5" fill="var(--amber)" stroke="none"/>
    </symbol>
    <symbol id="i-catalogue" viewBox="0 0 24 24">
      <path d="M8 6h13M8 12h13M8 18h13"/>
      <circle cx="4" cy="6" r="1.1" fill="currentColor" stroke="none"/>
      <circle cx="4" cy="12" r="1.1" fill="currentColor" stroke="none"/>
      <circle cx="4" cy="18" r="1.1" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-edit" viewBox="0 0 24 24">
      <path d="M4 20h4l10-10-4-4L4 16v4z"/><path d="M14 6l4 4"/>
    </symbol>
    <symbol id="i-chart" viewBox="0 0 24 24">
      <path d="M4 4v16h16"/><path d="M7 15l4-5 3 3 5-7"/>
    </symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-clear" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-archive" viewBox="0 0 24 24">
      <path d="M3 7h18v4H3zM5 11v9h14v-9"/><path d="M10 15h4"/>
    </symbol>
    <symbol id="i-reload" viewBox="0 0 24 24">
      <path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4h-4"/>
    </symbol>
    <symbol id="i-status" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4"/></symbol>
    <symbol id="i-prev" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></symbol>
  </defs>
</svg>
<a href="#main-content" class="skip-link">Skip to main content</a>
<div class="wrap">
  <header>
    <div class="brand">
      <svg class="mark" aria-hidden="true" focusable="false"><use href="#i-mark"/></svg>
      <div>
        <div class="eyebrow">Bluestaq Limited · JCO Reference</div>
        <h1>Legion</h1>
        <div class="subtitle">Tracked Systems</div>
      </div>
    </div>
  </header>
  <main id="main-content" class="layout">
    <div class="panel">
      <h2><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-catalogue"/></svg>Catalogue</h2>
      <div class="filters">
        <label class="visually-hidden" for="fSearch">Search catalogue</label>
        <input type="text" id="fSearch" placeholder="Search name, notes, NORAD ID…">
        <label class="visually-hidden" for="fNation">Filter by nation</label>
        <select id="fNation" aria-label="Filter by nation"><option value="">All nations</option></select>
        <label class="visually-hidden" for="fRegime">Filter by regime</label>
        <select id="fRegime" aria-label="Filter by regime"><option value="">All regimes</option></select>
        <label class="visually-hidden" for="fStatus">Filter by status</label>
        <select id="fStatus" aria-label="Filter by status">
          <option value="">All statuses</option>
          <option value="onorbit">On-orbit</option>
          <option value="decaying">Decaying</option>
          <option value="decayed">Decayed/Deorbited</option>
          <option value="unknown">Unconfirmed</option>
        </select>
        <label><input type="checkbox" id="fArchived"> Include archived</label>
        <label for="fRows">Rows
          <select id="fRows" aria-label="Rows per page">
            <option value="10">10</option>
            <option value="15" selected>15</option>
            <option value="25">25</option>
            <option value="50">50</option>
            <option value="0">All</option>
          </select>
        </label>
      </div>
      <output class="count" id="resultCount"></output>
      <div id="tableWrap"></div>
    </div>

    <div class="panel">
      <h2><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-edit"/></svg><span id="formTitle">New system</span></h2>
      <form id="systemForm">
        <div class="field"><label for="f_catalogue_name">Catalogue name *</label><input type="text" id="f_catalogue_name" required></div>
        <div class="field-row">
          <div class="field"><label for="f_designator">Designator</label><input type="text" id="f_designator"></div>
          <div class="field"><label for="f_norad_id">NORAD ID</label><input type="text" id="f_norad_id"></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="f_nation">Nation *</label><input type="text" id="f_nation" maxlength="4" required></div>
          <div class="field"><label for="f_regime">Regime *</label><input type="text" id="f_regime" required placeholder="LEO / GEO / HEO"></div>
        </div>
        <div class="field-row">
          <div class="field"><label for="f_launch_year">Launch year *</label><input type="number" id="f_launch_year" required min="1957" max="2100"></div>
          <div class="field"><label for="f_launch_site">Launch site</label><input type="text" id="f_launch_site"></div>
        </div>
        <div class="field"><label for="f_status">Status</label>
          <select id="f_status">
            <option value="unknown">Unconfirmed</option>
            <option value="onorbit">On-orbit</option>
            <option value="decaying">Decaying</option>
            <option value="decayed">Decayed / Deorbited</option>
          </select>
        </div>
        <div class="field-row">
          <div class="field"><label for="f_life">Operational life</label><input type="text" id="f_life"></div>
          <div class="field"><label for="f_coplanar">Coplanar</label><input type="text" id="f_coplanar"></div>
        </div>
        <div class="field"><label for="f_delta_v">Observed ΔV / manoeuvres</label><input type="text" id="f_delta_v"></div>
        <div class="field"><label for="f_flag">Flag</label><input type="text" id="f_flag" placeholder="e.g. NORAD ID clash — cross-check UDL"></div>
        <div class="field"><label for="f_notes">Notes</label><textarea id="f_notes"></textarea></div>
        <div class="field"><label for="f_family_id">Family ID *</label><input type="text" id="f_family_id" required placeholder="e.g. rus-2027-cluster"></div>
        <div class="field"><label for="f_family_title">Family title *</label><input type="text" id="f_family_title" required></div>
        <div class="field"><label for="f_family_sub">Family sub *</label><input type="text" id="f_family_sub" required></div>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-plus"/></svg><span id="submitLabel">Add system</span></button>
          <button type="button" class="btn btn-ghost" id="clearBtn"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-clear"/></svg>Clear</button>
          <button type="button" class="btn btn-danger" id="archiveBtn" style="display:none"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-archive"/></svg>Archive</button>
        </div>
        <output class="msg" id="formMsg"></output>
      </form>
    </div>

    <section class="panel chart-panel">
      <h2><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-chart"/></svg><span id="chartTitle">Family movement</span></h2>
      <div class="chart-controls">
        <label class="visually-hidden" for="cFamily">Family</label>
        <select id="cFamily"><option value="">Select a family…</option></select>
        <label class="visually-hidden" for="cWindow">Window</label>
        <select id="cWindow">
          <option value="7">Last 7 days</option>
          <option value="30" selected>Last 30 days</option>
          <option value="90">Last 90 days</option>
          <option value="180">Last 180 days</option>
          <option value="0">Full history</option>
        </select>
        <label class="visually-hidden" for="cMode">Scale</label>
        <select id="cMode">
          <option value="absolute">Absolute position</option>
          <option value="relative">Relative to window start</option>
        </select>
        <button type="button" class="btn btn-ghost" id="cWholeFamily" hidden><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-prev"/></svg>Whole family</button>
        <button type="button" class="btn btn-ghost" id="cReload"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-reload"/></svg>Reload</button>
      </div>
      <output class="msg" id="chartMsg">Pick a family to plot the class, or a row in the table to plot one object. Reads live UDL data.</output>
      <div id="charts"></div>
    </section>
  </main>
</div>

<script type="module">
const STATUS_LABEL = {onorbit:"On-orbit", decayed:"Decayed/Deorbited", decaying:"Decaying", unknown:"Unconfirmed"};
// Operational order, not alphabetical: sorting by status is a question about
// what is still flying, so on-orbit leads and unconfirmed trails.
const STATUS_ORDER = ["onorbit", "decaying", "decayed", "unknown"];
const EM_DASH = "—";
let selectedId = null;
let currentList = [];

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => (
    {"&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;"}[ch]
  ));
}

function qs(params){
  const p = new URLSearchParams();
  Object.entries(params).forEach(([k,v]) => { if(v !== "" && v !== null && v !== undefined) p.set(k, v); });
  return p.toString();
}

async function loadSystems(){
  const params = {
    q: document.getElementById("fSearch").value,
    nation: document.getElementById("fNation").value,
    regime: document.getElementById("fRegime").value,
    status_filter: document.getElementById("fStatus").value,
    include_archived: document.getElementById("fArchived").checked,
  };
  const res = await fetch("/api/systems?" + qs(params));
  const body = await res.json();
  currentList = body.systems;
  renderNationRegimeOptions(currentList);
  renderTable(currentList);
}

function renderNationRegimeOptions(list){
  const nationSel = document.getElementById("fNation");
  const regimeSel = document.getElementById("fRegime");
  const keepNation = nationSel.value, keepRegime = regimeSel.value;
  const nations = [...new Set(list.map(s => s.nation).filter(Boolean))].sort();
  const regimes = [...new Set(list.map(s => s.regime).filter(Boolean))].sort();
  nationSel.innerHTML = '<option value="">All nations</option>' + nations.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join("");
  regimeSel.innerHTML = '<option value="">All regimes</option>' + regimes.map(r => `<option value="${esc(r)}">${esc(r)}</option>`).join("");
  nationSel.value = keepNation; regimeSel.value = keepRegime;
}

/* ---------------------------------------------------------------------------
   Sorting

   Sorting happens in the browser against the rows already fetched, so it
   costs no request and holds through a re-render (selecting a row redraws the
   table). `key: null` means catalogue order, which is the seeded chronology
   and the order the table opens in.
--------------------------------------------------------------------------- */
const SORT_COLUMNS = [
  {key:"catalogue_name", label:"Name",     type:"text"},
  {key:"nation",         label:"Nation",   type:"text"},
  {key:"regime",         label:"Regime",   type:"text"},
  {key:"launch_year",    label:"Launch",   type:"number"},
  {key:"status",         label:"Status",   type:"status"},
  {key:"norad_id",       label:"NORAD ID", type:"number"},
];
const COLLATOR = new Intl.Collator("en-GB", {numeric:true, sensitivity:"base"});
const NATION_CLASS = {RU:"rus", CN:"chn"};

function nationClass(nation){ return NATION_CLASS[nation] || "other"; }
let sortState = {key:null, direction:1};

/* Pagination

   Client-side, deliberately, and for one structural reason: sorting is
   client-side too. Paginating on the server while sorting here would slice
   page two out of the server's order and then sort only that slice, so the
   rows on a page would be the wrong rows. Both belong on the same side, and
   with a catalogue this size - hand-entered, tens of records - that side is
   the browser. If the catalogue ever grows to thousands, sorting and paging
   move to the server together, not one at a time.

   The row count preference is a per-viewer convenience, so it lives in
   localStorage, wrapped: a private window or blocked site data throws on
   access rather than returning null. */
const ALL_ROWS = 0;
const DEFAULT_ROWS = 15;
const ROWS_KEY = "catalogueRows";
// Validated against the exact option strings rather than a parsed number.
// Number(null) and Number("") are both 0, which is the "All" sentinel, so
// parsing first made an absent or empty preference mean "show everything" -
// the opposite of the default, and exactly what a first visit hit.
const ROW_OPTIONS = new Set(["10", "15", "25", "50", "0"]);

function storedRows(){
  try{
    const raw = localStorage.getItem(ROWS_KEY);
    if(ROW_OPTIONS.has(raw)) return Number(raw);
  } catch { /* storage unavailable: fall through to the default */ }
  return DEFAULT_ROWS;
}

function rememberRows(value){
  try{ localStorage.setItem(ROWS_KEY, String(value)); }
  catch { /* nothing to do: the choice simply will not persist */ }
}

let rowsPerPage = storedRows();
let currentPage = 1;

function pageCount(total){
  if(rowsPerPage === ALL_ROWS) return 1;
  return Math.max(1, Math.ceil(total / rowsPerPage));
}

function visibleSlice(rows){
  if(rowsPerPage === ALL_ROWS) return rows;
  const start = (currentPage - 1) * rowsPerPage;
  return rows.slice(start, start + rowsPerPage);
}

function rangeLabel(total, shown){
  if(total === 0) return "No systems match the current filters";
  const suffix = total === 1 ? "" : "s";
  if(rowsPerPage === ALL_ROWS || total <= rowsPerPage){
    return `${total} system${suffix}`;
  }
  const first = (currentPage - 1) * rowsPerPage + 1;
  return `Showing ${first} to ${first + shown - 1} of ${total} system${suffix}`;
}

function pagerMarkup(total){
  const pages = pageCount(total);
  if(pages < 2) return "";
  const back = currentPage > 1 ? "" : " disabled";
  const forward = currentPage < pages ? "" : " disabled";
  return `<div class="pager">
    <button type="button" class="btn btn-ghost" data-page="prev" aria-label="Previous page"${back}><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-prev"/></svg>Previous</button>
    <span class="page-of">Page ${currentPage} of ${pages}</span>
    <button type="button" class="btn btn-ghost" data-page="next" aria-label="Next page"${forward}>Next<svg class="icon" aria-hidden="true" focusable="false"><use href="#i-next"/></svg></button>
  </div>`;
}

function sortValue(record, column){
  const raw = record[column.key];
  if(raw === null || raw === undefined || raw === "") return null;
  if(column.type === "number"){
    const parsed = Number(raw);
    return Number.isFinite(parsed) ? parsed : null;
  }
  if(column.type === "status"){
    const rank = STATUS_ORDER.indexOf(raw);
    return rank === -1 ? STATUS_ORDER.length : rank;
  }
  return String(raw);
}

function sortRows(list){
  if(!sortState.key) return list;
  const column = SORT_COLUMNS.find(c => c.key === sortState.key);
  if(!column) return list;
  return [...list].sort((a, b) => {
    const left = sortValue(a, column), right = sortValue(b, column);
    // A blank always sorts last, whichever way the column is pointing: a row
    // with no NORAD ID is missing data, not the smallest value.
    if(left === null && right === null) return COLLATOR.compare(a.catalogue_name, b.catalogue_name);
    if(left === null) return 1;
    if(right === null) return -1;
    const order = typeof left === "string" ? COLLATOR.compare(left, right) : left - right;
    // Ties break on name so the order is total, and so a re-render cannot
    // shuffle equal rows around.
    return order !== 0 ? order * sortState.direction : COLLATOR.compare(a.catalogue_name, b.catalogue_name);
  });
}

function ariaSortFor(active){
  if(!active) return "none";
  return sortState.direction === 1 ? "ascending" : "descending";
}

function sortMarkFor(active){
  if(!active) return "↕";
  return sortState.direction === 1 ? "▲" : "▼";
}

function sortHeader(){
  return SORT_COLUMNS.map(column => {
    const active = sortState.key === column.key;
    const ariaSort = ariaSortFor(active);
    const mark = sortMarkFor(active);
    return `<th class="sortable" aria-sort="${ariaSort}">
      <button type="button" data-sort="${column.key}">${esc(column.label)}<span class="sort-mark" aria-hidden="true">${mark}</span></button>
    </th>`;
  }).join("");
}

function renderTable(list){
  const wrap = document.getElementById("tableWrap");
  const count = document.getElementById("resultCount");
  if(list.length === 0){
    wrap.innerHTML = '<div class="empty">No systems match the current filters.</div>';
    count.textContent = rangeLabel(0, 0);
    return;
  }
  const sorted = sortRows(list);
  // A filter can shrink the list under the page you were on, and a page past
  // the end renders empty with no clue why. Clamp before slicing.
  currentPage = Math.min(Math.max(1, currentPage), pageCount(sorted.length));
  const rows = visibleSlice(sorted);
  count.textContent = rangeLabel(sorted.length, rows.length);
  wrap.innerHTML = `<table>
    <thead><tr>${sortHeader()}</tr></thead>
    <tbody>${rows.map(s => `
      <tr class="row ${s.id === selectedId ? "selected" : ""}" data-id="${esc(s.id)}">
        <td>${esc(s.catalogue_name)}${s.archived ? " <em>(archived)</em>" : ""}</td>
        <td><span class="badge ${nationClass(s.nation)}">${esc(s.nation)}</span></td>
        <td>${esc(s.regime)}</td>
        <td>${esc(s.launch_year)}</td>
        <td><span class="pill ${esc(s.status)}"><svg class="icon" aria-hidden="true" focusable="false"><use href="#i-status"/></svg>${esc(STATUS_LABEL[s.status] || s.status)}</span></td>
        <td>${esc(s.norad_id || EM_DASH)}</td>
      </tr>`).join("")}
    </tbody>
  </table>` + pagerMarkup(sorted.length);
  wrap.querySelectorAll("button[data-page]").forEach(button => {
    button.addEventListener("click", () => {
      currentPage += button.dataset.page === "next" ? 1 : -1;
      renderTable(currentList);
      wrap.scrollIntoView({block: "nearest"});
    });
  });
  wrap.querySelectorAll("tr.row").forEach(tr => {
    tr.addEventListener("click", () => selectSystem(tr.dataset.id));
  });
  wrap.querySelectorAll("button[data-sort]").forEach(button => {
    button.addEventListener("click", () => {
      const key = button.dataset.sort;
      sortState = sortState.key === key
        ? {key, direction: -sortState.direction}
        : {key, direction: 1};
      currentPage = 1;
      renderTable(currentList);
    });
  });
}

function selectSystem(id){
  selectedId = id;
  const record = currentList.find(s => s.id === id);
  if(!record) return;
  document.getElementById("formTitle").textContent = "Edit system";
  document.getElementById("submitLabel").textContent = "Save changes";
  document.getElementById("archiveBtn").style.display = record.archived ? "none" : "inline-block";
  for(const key of ["catalogue_name","designator","norad_id","nation","regime","launch_year","launch_site",
                    "status","life","coplanar","delta_v","flag","notes","family_id","family_title","family_sub"]){
    const el = document.getElementById("f_" + key);
    if(el) el.value = record[key] ?? "";
  }
  renderTable(currentList);
  document.getElementById("formMsg").textContent = "";
  // Selecting a row is the analyst saying "this one", so plot it. Deliberately
  // not awaited: the form must not wait on a live UDL call to become editable.
  void showObjectChart(record);
}

document.getElementById("clearBtn").addEventListener("click", () => {
  selectedId = null;
  document.getElementById("systemForm").reset();
  document.getElementById("formTitle").textContent = "New system";
  document.getElementById("submitLabel").textContent = "Add system";
  document.getElementById("archiveBtn").style.display = "none";
  document.getElementById("formMsg").textContent = "";
  renderTable(currentList);
  void showFamilyChart();
});

function collectPayload(){
  const get = id => document.getElementById("f_" + id).value.trim();
  return {
    catalogue_name: get("catalogue_name"),
    designator: get("designator") || null,
    norad_id: get("norad_id") || null,
    nation: get("nation").toUpperCase(),
    regime: get("regime").toUpperCase(),
    launch_year: parseInt(get("launch_year"), 10),
    launch_site: get("launch_site") || null,
    status: get("status"),
    life: get("life") || null,
    coplanar: get("coplanar") || null,
    delta_v: get("delta_v") || null,
    flag: get("flag") || null,
    notes: get("notes") || null,
    family_id: get("family_id"),
    family_title: get("family_title"),
    family_sub: get("family_sub"),
  };
}

document.getElementById("systemForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("formMsg");
  const payload = collectPayload();
  const headers = {"Content-Type": "application/json"};
  let res;
  if(selectedId){
    res = await fetch(`/api/systems/${selectedId}`, {method:"PATCH", headers, body: JSON.stringify(payload)});
  } else {
    res = await fetch("/api/systems", {method:"POST", headers, body: JSON.stringify(payload)});
  }
  if(res.ok){
    msg.textContent = selectedId ? "Saved." : "Added.";
    msg.className = "msg ok";
    await loadSystems();
    await loadFamilies();
  } else {
    const body = await res.json().catch(() => ({}));
    msg.textContent = "Error: " + (body.detail || res.status);
    msg.className = "msg error";
  }
});

document.getElementById("archiveBtn").addEventListener("click", async () => {
  if(!selectedId) return;
  if(!confirm("Archive this system? It stays in the store but is hidden by default.")) return;
  const res = await fetch(`/api/systems/${selectedId}`, {method:"DELETE"});
  const msg = document.getElementById("formMsg");
  if(res.ok){
    // Clear first: the clear handler blanks this message, so setting it
    // beforehand meant the confirmation never reached the screen.
    document.getElementById("clearBtn").click();
    msg.textContent = "Archived.";
    msg.className = "msg ok";
    await loadSystems();
    await loadFamilies();
  } else {
    msg.textContent = "Error archiving.";
    msg.className = "msg error";
  }
});

function reloadFromFirstPage(){
  currentPage = 1;
  return loadSystems();
}

["fSearch","fNation","fRegime","fStatus","fArchived"].forEach(id => {
  document.getElementById(id).addEventListener("input", reloadFromFirstPage);
  document.getElementById(id).addEventListener("change", reloadFromFirstPage);
});

document.getElementById("fRows").value = String(rowsPerPage);
document.getElementById("fRows").addEventListener("change", event => {
  rowsPerPage = Number(event.target.value);
  rememberRows(rowsPerPage);
  currentPage = 1;
  renderTable(currentList);
});

/* ---------------------------------------------------------------------------
   Family movement charts

   One chart per metric, never two scales on one plot. A GEO object is drawn
   on mean longitude and a LEO object on mean motion; a family holding both
   gets two charts stacked, because sharing an axis between them would invent
   a relationship that is not in the data.

   Colour comes from the server's colour_index, which is the satellite's fixed
   position in its family, so filtering the catalogue never repaints a
   surviving line. Eight slots, never cycled.
--------------------------------------------------------------------------- */
const CHART_W = 900, CHART_H = 300;
const PAD = {top:16, right:112, bottom:36, left:62};
const PLOT_W = CHART_W - PAD.left - PAD.right;
const PLOT_H = CHART_H - PAD.top - PAD.bottom;
// Read from the stylesheet rather than repeated here, so the palette has one
// definition and the SVG cannot drift from the CSS.
const CSS = getComputedStyle(document.documentElement);
function cssColour(name){ return CSS.getPropertyValue(name).trim(); }
const SERIES_SLOTS = 8;
const SERIES_COLOURS = Array.from({length: SERIES_SLOTS}, (_, i) => cssColour(`--series-${i + 1}`));
const GRID = cssColour("--line-soft");
const AXIS_TEXT = cssColour("--text-faint");
const SURFACE = cssColour("--surface-2");
const LONGITUDE_METRIC = "mean_longitude";
const HIT_RADIUS = 26;
const LABEL_CLEARANCE = 14;
const DAY_MS = 86400000;

function colourFor(index){ return SERIES_COLOURS[index % SERIES_COLOURS.length]; }

/* Absolute or relative.

   A GEO family can be spread across 200 degrees of the belt, and on that
   scale a satellite's three degrees of drift is a flat line. Re-basing every
   series to its own first value in the window puts them on one comparable
   scale - the standard move for series of different offsets, and the only
   way the class's *movement* is legible. Absolute stays the default because
   it is the un-transformed truth and answers the other question: where is
   this class parked. */
let chartMode = "absolute";
let lastPayload = null;

function plotted(series, isLongitude){
  const values = series.points.map(point => point.value);
  if(chartMode !== "relative" || values.length === 0) return values;
  if(!isLongitude) return values.map(value => value - values[0]);
  // Sum the step-by-step change rather than differencing against the first
  // point. Over a full history an object can drift right round the belt, and
  // a wrapped difference would report that as -160 degrees instead of +200.
  // Same reasoning as the drift rate on the server.
  const cumulative = [0];
  for(let i = 1; i < values.length; i++){
    cumulative.push(cumulative[i - 1] + wrapDegrees(values[i] - values[i - 1]));
  }
  return cumulative;
}

function wrapDegrees(value){ return ((value + 180) % 360 + 360) % 360 - 180; }

function decimalsFor(range){
  if(range >= 10) return 1;
  if(range >= 1) return 2;
  if(range >= 0.1) return 3;
  if(range >= 0.01) return 4;
  return 5;
}

function decimalsForStep(step){
  if(step >= 1) return 0;
  return Math.min(6, Math.ceil(-Math.log10(step)));
}

// The 1-2-5-10 ladder that keeps axis ticks on round numbers.
function stepMultiplier(normalised){
  if(normalised >= 5) return 10;
  if(normalised >= 2) return 5;
  if(normalised >= 1) return 2;
  return 1;
}

function niceTicks(lo, hi, target){
  const raw = (hi - lo) / target;
  const magnitude = Math.pow(10, Math.floor(Math.log10(raw)));
  const normalised = raw / magnitude;
  const step = stepMultiplier(normalised) * magnitude;
  const ticks = [];
  for(let value = Math.ceil(lo / step) * step; value <= hi + step * 1e-9; value += step){
    ticks.push(Number(value.toFixed(10)));
  }
  return {ticks, step};
}

// Axis tick format follows the span, because a full history runs to years and
// "29 Jul" on a four-year axis names four different days.
const SPAN_NEEDING_TIME = 2 * DAY_MS;
const SPAN_NEEDING_YEAR = 300 * DAY_MS;

function formatDate(ms, spanMs){
  const date = new Date(ms);
  if(spanMs >= SPAN_NEEDING_YEAR){
    return date.toLocaleDateString("en-GB", {month:"short", year:"numeric", timeZone:"UTC"});
  }
  const day = date.toLocaleDateString("en-GB", {day:"numeric", month:"short", timeZone:"UTC"});
  if(spanMs >= SPAN_NEEDING_TIME) return day;
  const time = date.toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit", timeZone:"UTC"});
  return `${day} ${time}`;
}

function tickAnchor(fraction){
  if(fraction === 0) return "start";
  if(fraction === 1) return "end";
  return "middle";
}

function formatEpoch(iso){
  return new Date(iso).toISOString().replace("T", " ").slice(0, 16) + "Z";
}

function withUnit(value, unit){
  // A degree sign sits tight against the number; a word unit needs the space.
  return unit.startsWith("°") ? `${value}${unit}` : `${value} ${unit}`;
}

function seriesSummary(series, decimals, unit){
  const parts = [];
  // The rank is why this object was pulled at all, so it travels with it.
  if(series.hrr_rank !== null && series.hrr_rank !== undefined){
    parts.push(`<span class="legend-rank">rank ${esc(series.hrr_rank)}</span>`);
  }
  if(series.latest_value !== null && series.latest_value !== undefined){
    parts.push(`<span class="legend-value">${esc(withUnit(series.latest_value.toFixed(decimals), unit))}</span>`);
  }
  if(series.drift_deg_per_day !== null && series.drift_deg_per_day !== undefined){
    const drift = series.drift_deg_per_day;
    parts.push(`<span class="legend-value">${drift >= 0 ? "+" : ""}${esc(drift.toFixed(3))}°/day</span>`);
  }
  if(series.note) parts.push(`<span class="legend-note">${esc(series.note)}</span>`);
  return parts.join(" · ");
}

function chartMarkup(chart, index){
  const isLongitude = chart.metric === LONGITUDE_METRIC;
  const relative = chartMode === "relative";
  const unit = relative && isLongitude ? "°" : chart.unit;
  const prepared = chart.series
    .map(series => ({
      series,
      values: plotted(series, isLongitude),
      times: series.points.map(point => Date.parse(point.epoch)),
    }))
    .filter(entry => entry.values.length > 0);

  let svg = '<div class="empty">No element sets in this window for any member of this family.</div>';
  let hits = [];
  let decimals = 2;

  if(prepared.length > 0){
    const values = prepared.flatMap(entry => entry.values);
    const times = prepared.flatMap(entry => entry.times);
    let lo = Math.min(...values), hi = Math.max(...values);
    const spread = (hi - lo) || Math.max(Math.abs(hi) * 0.001, isLongitude ? 0.5 : 0.001);
    lo -= spread * 0.12; hi += spread * 0.12;
    let xMin = Math.min(...times), xMax = Math.max(...times);
    if(xMax === xMin){ xMin -= DAY_MS / 2; xMax += DAY_MS / 2; }
    decimals = Math.min(decimalsFor(hi - lo), 4);

    const sx = t => PAD.left + ((t - xMin) / (xMax - xMin)) * PLOT_W;
    const sy = v => PAD.top + PLOT_H - ((v - lo) / (hi - lo)) * PLOT_H;

    const {ticks, step} = niceTicks(lo, hi, 5);
    const tickDecimals = decimalsForStep(step);
    const grid = ticks.map(value => `
      <line x1="${PAD.left}" y1="${sy(value).toFixed(2)}" x2="${PAD.left + PLOT_W}" y2="${sy(value).toFixed(2)}" stroke="${GRID}" stroke-width="1"/>
      <text x="${PAD.left - 10}" y="${(sy(value) + 3.5).toFixed(2)}" text-anchor="end" font-size="10" fill="${AXIS_TEXT}" style="font-variant-numeric:tabular-nums">${esc(value.toFixed(tickDecimals))}</text>`).join("");

    const span = xMax - xMin;
    const xTicks = [0, 0.25, 0.5, 0.75, 1].map(fraction => {
      const at = xMin + span * fraction;
      const anchor = tickAnchor(fraction);
      return `<text x="${sx(at).toFixed(2)}" y="${CHART_H - 14}" text-anchor="${anchor}" font-size="10" fill="${AXIS_TEXT}">${esc(formatDate(at, span))}</text>`;
    }).join("");

    const ends = prepared.map(entry => ({
      entry,
      x: sx(entry.times[entry.times.length - 1]),
      y: sy(entry.values[entry.values.length - 1]),
    })).sort((a, b) => a.y - b.y);
    // Direct labels only where they will not collide. Where lines converge the
    // legend carries identity instead: nudging labels apart detaches them from
    // their line and reads as noise.
    let lastLabelY = -Infinity;
    ends.forEach(end => {
      end.label = end.y - lastLabelY >= LABEL_CLEARANCE;
      if(end.label) lastLabelY = end.y;
    });

    const marks = ends.map(end => {
      const {entry} = end;
      const colour = colourFor(entry.series.colour_index);
      const coords = entry.values.map((value, i) => ({x: sx(entry.times[i]), y: sy(value)}));
      coords.forEach((coord, i) => hits.push({
        x: coord.x, y: coord.y, colour,
        name: entry.series.catalogue_name,
        epoch: entry.series.points[i].epoch,
        value: entry.values[i],
        absolute: entry.series.points[i].value,
      }));
      let path = "";
      if(coords.length > 1){
        const segments = [];
        let current = [];
        coords.forEach((coord, i) => {
          // A track crossing the antimeridian jumps 360 degrees. Breaking the
          // line there is honest; sweeping it across the plot would not be.
          if(i > 0 && isLongitude && Math.abs(entry.values[i] - entry.values[i - 1]) > 180){
            segments.push(current); current = [];
          }
          current.push(`${coord.x.toFixed(2)},${coord.y.toFixed(2)}`);
        });
        segments.push(current);
        const d = segments.filter(segment => segment.length > 1).map(segment => "M" + segment.join("L")).join(" ");
        if(d) path = `<path d="${d}" fill="none" stroke="${colour}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
      }
      const dot = `<circle cx="${end.x.toFixed(2)}" cy="${end.y.toFixed(2)}" r="4" fill="${colour}" stroke="${SURFACE}" stroke-width="2"/>`;
      const label = end.label
        ? `<text x="${(end.x + 10).toFixed(2)}" y="${(end.y + 3.5).toFixed(2)}" font-size="10.5" fill="${AXIS_TEXT}">${esc(entry.series.catalogue_name)}</text>`
        : "";
      return path + dot + label;
    }).join("");

    const caption = relative
      ? `${chart.title} relative to each satellite's first element set in this window`
      : chart.title;
    svg = `<svg class="chart" viewBox="0 0 ${CHART_W} ${CHART_H}" role="img" aria-label="${esc(caption)}, one line per family member. The table below carries the same values.">
      ${grid}
      <line x1="${PAD.left}" y1="${PAD.top + PLOT_H}" x2="${PAD.left + PLOT_W}" y2="${PAD.top + PLOT_H}" stroke="${GRID}" stroke-width="1"/>
      ${xTicks}
      ${marks}
      <circle id="focus-${index}" r="7" fill="none" stroke="none" stroke-width="2"/>
    </svg>`;
  }

  const legend = chart.series.map(series => `
    <span class="legend-item">
      <span class="legend-key" style="background:${colourFor(series.colour_index)}"></span>
      <span>${esc(series.catalogue_name)}</span>
      ${seriesSummary(series, decimals, chart.unit)}
    </span>`).join("");

  const rows = prepared.flatMap(entry => entry.series.points.map((point, i) => `
    <tr>
      <td>${esc(entry.series.catalogue_name)}</td>
      <td>${esc(entry.series.norad_id)}</td>
      <td>${esc(formatEpoch(point.epoch))}</td>
      <td>${esc(point.value.toFixed(decimals))}</td>
      ${relative ? `<td>${esc(entry.values[i].toFixed(decimals))}</td>` : ""}
    </tr>`));
  const table = `
    <details class="table-view">
      <summary>Table view — every plotted value (${rows.length})</summary>
      <div class="chart-table">
        <table>
          <thead><tr>
            <th>Satellite</th><th>NORAD ID</th><th>Epoch (UTC)</th>
            <th>${esc(chart.title)} (${esc(chart.unit)})</th>
            ${relative ? `<th>Change (${esc(unit)})</th>` : ""}
          </tr></thead>
          <tbody>${rows.join("")}</tbody>
        </table>
      </div>
    </details>`;

  const subtitle = relative ? " · change since the start of the window" : "";
  return {
    html: `<div class="chart-block">
      <h3>${esc(chart.title)} <span class="chart-unit">${esc(unit)}${esc(subtitle)}</span></h3>
      <p class="chart-note">${esc(chart.description)}</p>
      <div class="chart-figure" id="figure-${index}">${svg}<div class="tip" id="tip-${index}"></div></div>
      <div class="legend">${legend}</div>
      ${table}
    </div>`,
    hits,
    decimals,
    unit,
    relative,
    figureId: `figure-${index}`,
  };
}

function attachHover(block, index, absoluteUnit){
  const figure = document.getElementById(block.figureId);
  const svg = figure.querySelector("svg");
  if(!svg || block.hits.length === 0) return;
  const tip = document.getElementById(`tip-${index}`);
  const focus = document.getElementById(`focus-${index}`);

  const hide = () => { tip.classList.remove("on"); focus.setAttribute("stroke", "none"); };

  svg.addEventListener("mousemove", event => {
    const box = svg.getBoundingClientRect();
    const x = (event.clientX - box.left) * (CHART_W / box.width);
    const y = (event.clientY - box.top) * (CHART_H / box.height);
    let nearest = null, best = HIT_RADIUS;
    block.hits.forEach(hit => {
      const distance = Math.hypot(hit.x - x, hit.y - y);
      if(distance < best){ best = distance; nearest = hit; }
    });
    if(!nearest){ hide(); return; }
    focus.setAttribute("cx", nearest.x);
    focus.setAttribute("cy", nearest.y);
    focus.setAttribute("stroke", nearest.colour);
    const sign = nearest.value >= 0 && block.relative ? "+" : "";
    const shown = withUnit(`${sign}${nearest.value.toFixed(block.decimals)}`, block.unit);
    const absolute = block.relative
      ? `<br><span class="tip-value">${esc(withUnit(nearest.absolute.toFixed(block.decimals), absoluteUnit))} absolute</span>`
      : "";
    tip.innerHTML = `<span class="tip-name">${esc(nearest.name)}</span><br>
      <span class="tip-value">${esc(shown)}</span>${absolute}<br>
      ${esc(formatEpoch(nearest.epoch))}`;
    tip.classList.add("on");
    tip.style.left = `${(nearest.x / CHART_W) * box.width + 14}px`;
    tip.style.top = `${(nearest.y / CHART_H) * box.height - 10}px`;
  });
  svg.addEventListener("mouseleave", hide);
}

function skippedLine(skipped){
  if(skipped.length === 0) return "";
  const named = skipped
    .map(entry => esc(entry.catalogue_name) + " (" + esc(entry.reason) + ")")
    .join("; ");
  return `<p class="skipped">Not charted: ${named}.</p>`;
}

/* The empty state has to follow the scope on screen. "Nothing in this family
   cleared the checks" is simply wrong under a single object, and a message
   that describes the wrong thing sends the reader looking in the wrong place.
   It also never names a cause it cannot see: the skip reason underneath is
   the cause, and it comes from the server. */
function emptyChartReason(payload){
  if(chartView.kind === "object"){
    return payload.skipped.length > 0
      ? "This object is not charted. The reason is below."
      : "No element sets came back for this object.";
  }
  return payload.skipped.length > 0
    ? "Nothing in this family cleared the checks. See below for each object."
    : "This family has no catalogued members to chart.";
}

function renderCharts(payload){
  const host = document.getElementById("charts");
  if(payload.charts.length === 0){
    const reason = emptyChartReason(payload);
    host.innerHTML = `<div class="empty">${esc(reason)}</div>` + skippedLine(payload.skipped);
    return;
  }
  const blocks = payload.charts.map((chart, index) => chartMarkup(chart, index));
  const skipped = skippedLine(payload.skipped);
  host.innerHTML = blocks.map(block => block.html).join("") + skipped;
  blocks.forEach((block, index) => attachHover(block, index, payload.charts[index].unit));
}

async function loadFamilies(){
  const res = await fetch("/api/systems");
  if(!res.ok) return;
  const body = await res.json();
  const families = new Map();
  body.systems.forEach(system => {
    const entry = families.get(system.family_id) || {title: system.family_title, count: 0};
    entry.count += 1;
    families.set(system.family_id, entry);
  });
  const select = document.getElementById("cFamily");
  const keep = select.value;
  const options = [...families.entries()]
    .sort((a, b) => COLLATOR.compare(a[1].title, b[1].title))
    .map(([id, entry]) => `<option value="${esc(id)}">${esc(entry.title)} (${entry.count})</option>`)
    .join("");
  select.innerHTML = '<option value="">Select a family…</option>' + options;
  select.value = keep;
}

/* The chart panel depends on one piece of deployment configuration that the
   catalogue does not: UDL credentials, without which no element set can be
   fetched at all. /readyz reports that, so the panel names what is missing on
   load instead of answering with an error after the analyst picks a family. */
async function missingConfiguration(){
  try{
    const res = await fetch("/readyz");
    const body = await res.json();
    if(body.udl_configured) return null;
    return "No charts are possible yet: this deployment needs "
      + "UDL_USERNAME and UDL_PASSWORD set in its Configuration tab. "
      + "Element sets come from live UDL. The catalogue above works without them.";
  } catch {
    return null;
  }
}

const SOURCE_LABELS = {
  "elset-history": "element-set history",
  "elset-latest": "latest element set only",
};

const CHART_ERRORS = {
  429: "Too many requests just now. Wait a moment and reload.",
  502: "UDL did not answer. Try again, or check the UDL status.",
};

function chartErrorMessage(status, detail){
  return CHART_ERRORS[status] || detail || `Could not load element sets (${status}).`;
}

/* The panel plots one of two things and never both: a whole family, or a
   single object from the table. They are the same chart with the same rules -
   same JCO HRR rank 0-3 gate, same metric per regime, same colour for a given
   satellite - so they share one loader and differ only in the request. The
   window and the scale apply to whichever is on screen. */
let chartView = {kind: "family"};

function chartRequest(){
  const windowDays = document.getElementById("cWindow").value;
  if(chartView.kind === "object"){
    return {
      url: "/api/udl/object-elements",
      params: {record_id: chartView.recordId, window_days: windowDays},
    };
  }
  const familyId = document.getElementById("cFamily").value;
  if(!familyId) return null;
  return {
    url: "/api/udl/family-elements",
    params: {family_id: familyId, window_days: windowDays},
  };
}

/* Each branch is its own statement rather than a ternary inside a template
   slot inside another ternary. SonarQube reads that as nested and fails the
   gate on it, and it is genuinely harder to read. */
function objectSubject(payload, charted){
  const state = charted === 0 ? "not charted" : "one object";
  return `${payload.family_title} · ${state}`;
}

function familySubject(payload, charted){
  const plural = charted === 1 ? "" : "s";
  return `${payload.family_title} · ${charted} object${plural}`;
}

function describeChart(payload){
  const depth = SOURCE_LABELS[payload.source] || payload.source;
  const span = payload.window_days === 0 ? "full history" : `last ${payload.window_days} days`;
  const charted = payload.charts.reduce((total, chart) => total + chart.series.length, 0);
  const subject = chartView.kind === "object"
    ? objectSubject(payload, charted)
    : familySubject(payload, charted);
  return `${subject} · ${span} · ${depth} · JCO HRR rank 0-3 · generated ${formatEpoch(payload.generated_at)}`;
}

function applyChartScope(){
  const isObject = chartView.kind === "object";
  document.getElementById("chartTitle").textContent = isObject ? "Object history" : "Family movement";
  document.getElementById("cWholeFamily").hidden = !isObject;
}

async function loadCharts(){
  const msg = document.getElementById("chartMsg");
  const host = document.getElementById("charts");
  applyChartScope();
  const request = chartRequest();
  if(!request){
    host.innerHTML = "";
    lastPayload = null;
    msg.textContent = "Pick a family to plot the class, or a row in the table to plot one object.";
    msg.className = "msg";
    return;
  }
  msg.textContent = "Loading element sets…";
  msg.className = "msg";
  host.classList.add("stale");
  let res;
  try{
    res = await fetch(request.url + "?" + qs(request.params));
  } catch {
    host.classList.remove("stale");
    msg.textContent = "Could not reach the server.";
    msg.className = "msg error";
    return;
  }
  host.classList.remove("stale");
  if(!res.ok){
    const body = await res.json().catch(() => ({}));
    host.innerHTML = "";
    msg.textContent = chartErrorMessage(res.status, body.detail);
    msg.className = "msg error";
    return;
  }
  lastPayload = await res.json();
  renderCharts(lastPayload);
  msg.textContent = describeChart(lastPayload);
  msg.className = "msg";
}

/* Selecting a row in the table plots that object. The catalogue record is the
   only thing sent: the server resolves the NORAD ID, applies the rank gate and
   picks the metric, so the UI cannot drift from the family chart's rules. */
async function showObjectChart(record){
  chartView = {kind: "object", recordId: record.id};
  await loadCharts();
}

function showFamilyChart(){
  chartView = {kind: "family"};
  return loadCharts();
}

document.getElementById("cFamily").addEventListener("change", showFamilyChart);
document.getElementById("cWholeFamily").addEventListener("click", showFamilyChart);
// The window applies to whichever scope is on screen, so these reload it as-is.
document.getElementById("cWindow").addEventListener("change", loadCharts);
document.getElementById("cReload").addEventListener("click", loadCharts);
// Switching scale is a redraw of data already fetched, never another UDL call.
document.getElementById("cMode").addEventListener("change", () => {
  chartMode = document.getElementById("cMode").value;
  if(lastPayload) renderCharts(lastPayload);
});

// Top-level await: a module script is deferred, so the DOM is already parsed,
// and awaiting means a failed first load surfaces rather than becoming an
// unhandled rejection.
await loadSystems();
await loadFamilies();

const configurationGap = await missingConfiguration();
if(configurationGap){
  const msg = document.getElementById("chartMsg");
  msg.textContent = configurationGap;
  msg.className = "msg error";
}
</script>
</body>
</html>
